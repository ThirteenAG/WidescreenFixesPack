; Gamepad support for Silent Hill 3, through Xidi (https://github.com/samuelgr/Xidi)
; XInput controllers use Xidi's built-in backend. Other pads can use Steam Input or DS4Windows.
;
; The mapper below arranges the pad like the game's built-in default controls, so the game needs no
; configuration. The widescreen fix expects this layout for its stick handling, the modern camera and the
; button names in the game's Button Config screen.
;
;   A / RT      Action, Enter                B           Run, Cancel
;   X           Flashlight (Zoom on the map)  Y           Map
;   LB / RB     Step left / right             LT          Ready weapon
;   Back        Inventory, Skip               Start       Pause
;   LS click    Supplies                      RS click    Search view (modern camera: recentre)
;   Left stick  Move                          Right stick Camera
;   D-pad       Move, menus
;
; Game button numbers (key.ini "buttonN" = Button(N+1) here): 0 map, 1 action/enter, 2 run/cancel,
; 3 flashlight, 4 search view, 5 ready, 6 step left, 7 step right, 8 inventory/skip, 9 pause,
; 10 supplies, 11 zoom.


[Mapper]
Type = SilentHill3

[CustomMapper:SilentHill3]
StickLeftX = Axis(X)
StickLeftY = Axis(Y)
StickRightX = Axis(Z)
StickRightY = Axis(RotZ)
DpadUp = Pov(Up)
DpadDown = Pov(Down)
DpadLeft = Pov(Left)
DpadRight = Pov(Right)
ButtonA = Button(2)
ButtonB = Button(3)
ButtonX = Compound(Button(4), Button(12))
ButtonY = Button(1)
ButtonLB = Button(7)
ButtonRB = Button(8)
TriggerLT = Button(6)
TriggerRT = Button(2)
ButtonBack = Button(9)
ButtonStart = Button(10)
ButtonLS = Button(11)
ButtonRS = Button(5)

[Properties]
ForceFeedbackEffectStrengthPercent = 100

