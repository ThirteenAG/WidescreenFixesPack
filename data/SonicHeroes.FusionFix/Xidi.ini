; Gamepad support for Sonic Heroes, through Xidi (https://github.com/samuelgr/Xidi)
; XInput controllers use Xidi's built-in backend. Other pads can use Steam Input or DS4Windows.
;
; The mapper below matches the game's default Button Configuration and the button letters its HUD and
; messages show, so the game needs no configuration:
;
;   A           Jump, confirm                X           Action, cancel
;   Y / B       Formation change (the HUD shows Y and B beside the team)
;   LB / RB     Team Blast                   LT / RT     Rotate the camera left / right
;   Start       Pause                        Left stick  Move (d-pad too)
;   Right stick Rotate the camera left / right
;
; Game button numbers (Button Configuration, Pad_Assign1 in sonic_h.ini, Button(N) = number N-1 there):
; 0 jump, 1 formation clockwise, 3 action, 4 formation counterclockwise, 5 team blast, 6 camera left,
; 7 camera right, 8 start/pause.


[Mapper]
Type = SonicHeroes

[CustomMapper:SonicHeroes]
StickLeftX = Axis(X)
StickLeftY = Axis(Y)
StickRightX = Split(Button(8), Button(7))
StickRightY = Null
DpadUp = Pov(Up)
DpadDown = Pov(Down)
DpadLeft = Pov(Left)
DpadRight = Pov(Right)
ButtonA = Button(1)
ButtonB = Button(2)
ButtonX = Button(4)
ButtonY = Button(5)
ButtonLB = Button(6)
ButtonRB = Button(6)
TriggerLT = Button(7)
TriggerRT = Button(8)
ButtonBack = Null
ButtonStart = Button(9)
ButtonLS = Null
ButtonRS = Null

[Properties]
ForceFeedbackEffectStrengthPercent = 100

