; Gamepad support for Street Racing Syndicate, through Xidi (https://github.com/samuelgr/Xidi)
;
; The fix binds this layout for player 1 next to the keyboard, so the pad works without setup:
;   RT              Accelerate          LT              Brake / Reverse
;   Left stick      Steer               D-pad           Steer, menus
;   A               NOS, menu select    B               Rear view, menu back
;   X               Hand brake          Y               Change view
;   RB              Gear up             LB              Gear down
;   LS              Clutch              RS              High beam
;   Back            View map            Start           Pause
;
; Each trigger has its own half axis, so both can be held at once and both are analog.

[Mapper]
Type = SRS

[CustomMapper:SRS]
ButtonA = Button(1)
ButtonB = Button(2)
ButtonX = Button(3)
ButtonY = Button(4)
ButtonLB = Button(5)
ButtonRB = Button(6)
ButtonBack = Button(7)
ButtonStart = Compound(Button(8), Keyboard(Esc))
ButtonLS = Button(9)
ButtonRS = Button(10)
TriggerLT = Axis(Z, +)
TriggerRT = Axis(RotZ, +)
StickLeftX = Axis(X)
StickLeftY = Axis(Y)
StickRightX = Axis(RotX)
StickRightY = Axis(RotY)
DpadUp = Axis(Y, -)
DpadDown = Axis(Y, +)
DpadLeft = Axis(X, -)
DpadRight = Axis(X, +)

[Properties]
ForceFeedbackEffectStrengthPercent = 100
