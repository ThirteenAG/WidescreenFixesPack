[GENERAL]
SkipIntro = 1                          // Skips the intro logos and the Press any key screen.
SkipSystemDetection = 1                // Skips redundant hardware detection pop-up box.
ForceCPUAffinityToAllCores = 1         // Forces the CPU to use all cores, improving performance on some systems.

[DISPLAY]
WindowedMode = 0                       // Runs the game in a window instead of fullscreen.
UltraWideSupport = 1                   // Corrects the HUD and FOV for ultrawide and other non 16:9 aspect ratios.

[GRAPHICS]
DisableDOF = 1                         // Disables the depth of field blur.
DisableBlackAndWhiteFilter = 0         // Disables the desaturated black and white look used in shadows.
DisableCharacterLighting = 0           // Disables Predator Vision, making enemies blend better with the environment. Also affects characters in in-engine cutscenes.
EnhancedSonarVision = 0                // https://imgur.com/PfDDYG2
BlacklistIndicators = 0                // Enables bloom only in darkness.

[GAMEPLAY]
DisableNegativeMouseAcceleration = 1   // Removes negative mouse acceleration.
DisableMouseSmoothing = 1              // Removes the mouse smoothing (averaged over 4 frames).
RawMouseInput = 1                      // Uses raw mouse input for mouse look: no lost movement with high polling rate mice.
GamepadCameraSpeed = 1.0               // Camera speed with the gamepad stick (multiplier, 1.0 = original).
BlacklistControlScheme = 0             // Blacklist-style controls (toggle cover, hold to aim, etc).

[UNLOCKS]
UnlockDLC = 1                          // Unlocks all DLC content that can no longer be obtained due to server shutdown.

[SPLITSCREEN]
Enable = 1                             // Restores the original split screen co-op in one game window: Co-op -> Split Screen. Player 2 needs a gamepad.
GamepadPlayer1 = 0                     // Gamepad of player 1 (1-4, 0 = keyboard and mouse only).
GamepadPlayer2 = 1                     // Gamepad of player 2 (1-4).
ProfilePlayer2 = Guest                 // Profile of player 2 (created if missing), for its own uniform and loadout.

[2INSTANCESPLITSCREEN]
Enable = 0                             // Split screen co-op on one PC: launches a second instance of the game, each one in half of the screen, connect them over LAN (Create in one, join in the other). Forces windowed mode, the resolution is set automatically.
Layout = 0                             // 0 = top and bottom, 1 = left and right.
GamepadInstance1 = 1                   // Gamepad of the first window, top or left (1-4, 0 = none). Keyboard and mouse control the focused window.
GamepadInstance2 = 2                   // Gamepad of the second window, bottom or right (1-4, 0 = none).
ProfileInstance2 = Guest               // Profile of the second window (created if missing), the first one uses the usual profile.

[LOGITECH]
LightSyncRGB = 1                       // Dims mouse and keyboard lighting in darkness (and vice versa with BlacklistIndicators). Only Logitech hardware is supported. Requires the Logitech G HUB app.

[FILELOADER]
DumpPackedFiles = 0                    // Dumps the contents of all .umd archives into an 'unpacked' folder next to the exe (see _dump.log in it), rename it to 'update' to load the files from disk instead of the archives.

[LAN]
FixLAN = 1                             // Makes LAN play work: answers the matchmaking config request locally, sends LAN messages on every network adapter and connects to the host by the address its lobby came from.
ServerAddr = 127.0.0.1                 // Where the matchmaking config is requested from, 127.0.0.1 is answered by the game itself.
Log = 0                                // Writes the network log to Conviction_LAN.log next to the exe (Conviction_LAN2.log for the second instance).
