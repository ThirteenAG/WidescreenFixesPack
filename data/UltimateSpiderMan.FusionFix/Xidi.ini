; Native DirectInput bindings. Triggers use separate axes so they can be held together.
[Mapper]
Type = UltimateSpiderMan

[CustomMapper:UltimateSpiderMan]
StickLeftX = Axis(X)
StickLeftY = Axis(Y)
StickRightX = Axis(RotX)
StickRightY = Axis(RotY)
TriggerLT = Axis(Z, +)
TriggerRT = Axis(RotZ, +)
ButtonA = Button(1)
ButtonB = Button(2)
ButtonX = Button(3)
ButtonY = Button(4)
ButtonLB = Button(5)
ButtonRB = Button(6)
ButtonBack = Button(7)
ButtonStart = Button(8)
ButtonLS = Button(9)
ButtonRS = Button(10)
DpadUp = Pov(Up)
DpadRight = Pov(Right)
DpadDown = Pov(Down)
DpadLeft = Pov(Left)
