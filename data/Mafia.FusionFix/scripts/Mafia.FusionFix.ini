[MAIN]
WriteSettingsToFile = 1          // Saves all registry settings to savegame\settings.bin.
BorderlessWindowed = 1           // Makes windowed mode borderless when selected in Setup.exe.
LeftStickDeadzone = 10.0         // Left stick deadzone (0.0-100.0).
RightStickDeadzone = 10.0        // Right stick deadzone (0.0-100.0).
FPSLimit = 0                     // Frame rate limit, 0 = game default.

[WIDESCREEN]
WidescreenHUD = 1               // 0 = Centered 4:3 HUD, 1 = Widescreen HUD.
WidescreenMap = 1               // 0 = Centered 4:3 map, 1 = Widescreen map.
ZoomFMVs = 1                    // 0 = Fit videos to screen, 1 = Zoom to fullscreen.

[CUTSCENES]
CutsceneBorders = 3              // 0 = Off, 1 = Letterbox, 2 = Pillarbox, 3 = Both. Does not change the shot FOV.
NoCutsceneBorderAnimation = 0    // 0 = Slide borders in/out, 1 = Show/hide instantly.

[DRAW_DISTANCE]
Enable = 1                       // Overrides the draw distance.
DrawDistance = 600.0
SkipMinDistance = 20.0
SkipMaxDistance = 450.0

[GRAPHICS]
RestoreEyeAnimations = 1         // Uses original models with moving eyes from A2.dta instead of A8.dta.
RestoreCarScratches = 1          // Restores 1.0 scratch projector opacity on 1.1/1.2.
ConsoleGamma = 0                 // Applies a custom gamma curve similar to GTA IV on Xbox 360. Requires d3d8to9.
SMAA = 0                         // Enhanced subpixel morphological antialiasing. Requires d3d8to9.

[HUD]
RadarMap = 1                     // Draws the original PC city map inside the radar, as on Xbox.

[CAMERA]
FreeCamera = 1                   // Orbit the camera around the vehicle with the mouse and the right stick.
CameraReturnTimeout = 3.0        // Seconds without input before returning behind a moving car.
CameraReturnSpeed = 2.0          // Return speed, 0 = Disable automatic return.
