; Native DirectInput controller. The fix adds modern native action bindings.
[Mapper]
Type = Main

[CustomMapper:Main]
ButtonA      = Button(1)
ButtonB     = Button(2)
ButtonX     = Button(3)
ButtonY     = Button(4)
ButtonLB    = Button(5)
ButtonRB    = Button(6)
TriggerLT   = Button(7)
TriggerRT   = Button(8)
ButtonBack   = Button(9)
ButtonStart  = Button(10)
ButtonLS    = Button(11)
ButtonRS    = Button(12)
DpadUp       = Pov(Up)
DpadDown     = Pov(Down)
DpadLeft     = Pov(Left)
DpadRight    = Pov(Right)
StickLeftX  = Axis(X)
StickLeftY  = Axis(Y)
StickRightX = Axis(RotX)
StickRightY = Axis(RotY)
