[PROJECT2DFX]
; Maximum distant lights submitted per frame. Module-owned, no runtime allocations.
MaxVisibleLights = 900
; Set to 1 to enable
RenderLodLights = 1
; Makes lod lights bigger or smaller
CoronaRadiusMultiplier = 1.5
; Affects performance, for best results increase CPU Clock under System -> Emulation or lower farclip
CoronaFarClip = 500.0
; Render more stars in the sky
SkyGfx = 1

[DISTANTTRAFFIC]
; Render moving 3D cars/boats on the game's road/water paths, beyond native traffic.
DistantCars = 1
DistantBoats = 1
; Maximum simulated vehicles (0-40 cars, 0-8 boats). Rendering is capped per frame.
MaxCars = 40
MaxBoats = 8
; Traffic fades out at this distance, in world units (450-2000).
DrawDistance = 800.0
