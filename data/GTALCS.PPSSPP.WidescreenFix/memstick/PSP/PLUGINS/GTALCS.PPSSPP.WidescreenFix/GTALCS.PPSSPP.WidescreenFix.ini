; Frame rate, HUD/radar size, field of view, cutscene options and fast loading can also be
; changed in the pause menu (Display, More display options). Changes are saved here.
[MAIN]
; Skips intro
SkipIntro = 1
; 4:3, 16:9 etc or auto
ForceAspectRatio = auto
; 60 fps
Enable60FPS = 0
; Speed up the emulator during loadscreens and black screens
UnthrottleEmuDuringLoading = 1

[CONTROLS]
; For better experience, swap buttons and triggers in the emulator settings (LT/RT to aim and shoot, brake and accelerate)
; Press Aim + Jump to reload weapon
ModernControlScheme = 0

[HUD]
;Data provided by MAJEST1C_R3
HudScale = 0.75

[RADAR]
RadarScale = 0.83
RadarPosX = 12.0
; Set to -45.0 to set radar on top
RadarPosY = 196.0

[MPRADAR]
RadarScale = 0.63
RadarPosY = 170.0

[FOV]
; Keep scripted cutscene zoom when FOVFactor is customized. Aspect correction always applies.
RestoreCutsceneFOV = 1
FOVFactor = 1.0
; Animated borders preserve the original cutscene composition. Disable to see more scenery, without changing zoom.
CutsceneBorders = 1
