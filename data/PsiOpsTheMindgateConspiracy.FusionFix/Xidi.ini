; Xidi turns an Xbox-style (XInput) controller into the keys and mouse of Psi-Ops' default controls, laid out like
; the console version, with telekinesis and fire on the triggers. The fix loads Xidi and switches between the
; profiles below.

[Mapper]
Type = Main

[Properties]
MouseSpeedScalingFactorPercent = 60

; Play: A action and jump, B wall move, X melee, Y lock-on, LT telekinesis, RT fire, LB mind drain, RB weapon switch,
; left stick click crouch, right stick click sniper zoom, Back inventory, D-pad pyrokinesis (up), mind control (down),
; remote viewing (left), aura view (right)
[CustomMapper:Main]
StickLeftX  = Split(Keyboard(D), Keyboard(A))
StickLeftY  = Split(Keyboard(S), Keyboard(W))
StickRightX = MouseAxis(X)
StickRightY = MouseAxis(Y)
TriggerLT   = MouseButton(Right)
TriggerRT   = MouseButton(Left)
ButtonA     = Keyboard(Space)
ButtonB     = Keyboard(T)
ButtonX     = Keyboard(F)
ButtonY     = Keyboard(LControl)
ButtonLB    = Keyboard(E)
ButtonRB    = Keyboard(Tab)
ButtonLS    = Keyboard(C)
ButtonRS    = Keyboard(G)
ButtonBack  = Keyboard(R)
ButtonStart = Keyboard(Esc)
DpadUp      = Keyboard(Q)
DpadDown    = Keyboard(X)
DpadLeft    = Keyboard(Z)
DpadRight   = Keyboard(V)

; While telekinesis is held the D-pad raises and lowers the object
[CustomMapper:Telekinesis]
Template    = Main
DpadUp      = Keyboard(LShift)
DpadDown    = Keyboard(LMenu)

; Through the sniper scope the D-pad zooms in and out
[CustomMapper:Scope]
Template    = Main
DpadUp      = Keyboard(UpArrow)
DpadDown    = Keyboard(DownArrow)

; Menus, dialogs, the inventory and cutscenes (the menus take W, A, S, D like the arrow keys)
[CustomMapper:Menu]
StickLeftX  = Split(Keyboard(D), Keyboard(A))
StickLeftY  = Split(Keyboard(S), Keyboard(W))
StickRightX = MouseAxis(X)
StickRightY = MouseAxis(Y)
TriggerRT   = MouseButton(Left)
ButtonA     = Keyboard(Space)
ButtonB     = Keyboard(Esc)
ButtonY     = Keyboard(Esc)
ButtonBack  = Keyboard(R)
ButtonStart = Keyboard(Esc)
DpadUp      = Keyboard(UpArrow)
DpadDown    = Keyboard(DownArrow)
DpadLeft    = Keyboard(LeftArrow)
DpadRight   = Keyboard(RightArrow)

