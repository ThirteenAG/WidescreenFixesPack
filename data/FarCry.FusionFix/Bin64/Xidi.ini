;Far Cry has no controller bindings on PC. Xidi turns the controller into the game's default keys and mouse,
;so the in-game control settings keep working and keyboard and mouse stay usable at the same time.
;
;Left stick       Move (W A S D)
;Right stick      Look (mouse)
;RT / LT          Fire / Aim and zoom (mouse buttons)
;A                Jump, hold breath while zoomed (Space)
;B                Crouch (Left Ctrl)
;X                Reload (R)
;Y                Next weapon, zoom in while zoomed (Page Down, Num +)
;LB               Throw grenade (G)
;RB               Use, enter and leave vehicles (F)
;Left stick click  Sprint (Left Shift)
;Right stick click Prone (V)
;D-pad up         Binoculars (B)
;D-pad down       Flashlight (L)
;D-pad left       Previous weapon, zoom out while zoomed (Page Up, Num -)
;D-pad right      Fire mode (X)
;Back             Objectives (Tab)
;Start            Menu (Esc)
;In menus the right stick moves the pointer and RT clicks.

[Mapper]
Type = FarCry

[Properties]
MouseSpeedScalingFactorPercent = 100

[CustomMapper:FarCry]
StickLeftX  = Split(Keyboard(D), Keyboard(A))
StickLeftY  = Split(Keyboard(S), Keyboard(W))
StickRightX = MouseAxis(X)
StickRightY = MouseAxis(Y)
TriggerRT   = MouseButton(Left)
TriggerLT   = MouseButton(Right)
ButtonA     = Keyboard(Space)
ButtonB     = Keyboard(LControl)
ButtonX     = Keyboard(R)
ButtonY     = Compound(Keyboard(PgDn), Keyboard(Add))
ButtonLB    = Keyboard(G)
ButtonRB    = Keyboard(F)
ButtonLS    = Keyboard(LShift)
ButtonRS    = Keyboard(V)
DpadUp      = Keyboard(B)
DpadDown    = Keyboard(L)
DpadLeft    = Compound(Keyboard(PgUp), Keyboard(Subtract))
DpadRight   = Keyboard(X)
ButtonBack  = Keyboard(Tab)
ButtonStart = Keyboard(Esc)

