; Gamepad support for Silent Hill 4: The Room, through Xidi (https://github.com/samuelgr/Xidi)
; XInput controllers use the built-in backend. Other pads can use Steam Input or DS4Windows.
;
; The widescreen fix expects Xidi's standard gamepad layout below (buttons 1-12 = A B X Y LB RB LT RT Back Start
; LS RS, right stick on Z/RotZ). It sets up modern default controls in input.ini when the game's retail pad
; bindings are still in place, makes the sticks analog and names the pad buttons in the Button Config screen.
;
;   A           Action, Enter                 B           Cancel, Run
;   X           Items                         Y           Evade
;   LB / RB     Step left / right             LT          Camera behind Henry
;   RT          Ready weapon                  Back        Map
;   Start       Pause, Skip                   LS click    Scrapbook
;   RS click    Item info                     Sticks      Move / camera


[Mapper]
Type = SilentHill4

[CustomMapper:SilentHill4]
StickLeftX = Axis(X)
StickLeftY = Axis(Y)
StickRightX = Axis(Z)
StickRightY = Axis(RotZ)
DpadUp = Pov(Up)
DpadDown = Pov(Down)
DpadLeft = Pov(Left)
DpadRight = Pov(Right)
ButtonA = Button(1)
ButtonB = Button(2)
ButtonX = Button(3)
ButtonY = Button(4)
ButtonLB = Button(5)
ButtonRB = Button(6)
TriggerLT = Button(7)
TriggerRT = Button(8)
ButtonBack = Button(9)
ButtonStart = Button(10)
ButtonLS = Button(11)
ButtonRS = Button(12)

[Properties]
ForceFeedbackEffectStrengthPercent = 100

