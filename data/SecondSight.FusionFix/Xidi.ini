;Second Sight on PC reads only the keyboard and mouse. Xidi turns an XInput controller into the game's default keys
;and mouse, laid out like the console version: left stick move, right stick look, RT fire, LT aim, A action,
;B and X their keys, Y psi powers, RB and LB their keys, D-pad its four keys, stick clicks crouch and zoom, Start menu.
;Keep the game's default controls in secondsight.cfg for this layout.

[Mapper]
Type = Main

[Properties]
MouseSpeedScalingFactorPercent = 60

[CustomMapper:Main]
ButtonA     = Keyboard(SPACE)
ButtonB     = Keyboard(F)
ButtonX     = Keyboard(C)
ButtonY     = Keyboard(LSHIFT)
ButtonLB    = Keyboard(R)
ButtonRB    = Keyboard(E)
TriggerLT   = MouseButton(Right)
TriggerRT   = MouseButton(Left)
ButtonBack  = Keyboard(ESC)
ButtonStart = Keyboard(TAB)
ButtonLS    = Keyboard(LCONTROL)
ButtonRS    = Keyboard(Q)
DpadUp      = Keyboard(G)
DpadDown    = Keyboard(B)
DpadLeft    = Keyboard(N)
DpadRight   = Keyboard(M)
StickLeftX  = Split(Keyboard(D), Keyboard(A))
StickLeftY  = Split(Keyboard(S), Keyboard(W))
StickRightX = MouseAxis(X)
StickRightY = MouseAxis(Y)

