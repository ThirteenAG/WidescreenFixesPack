; Xidi turns an Xbox-style (XInput) controller into the keys and mouse of Total Overdose's default controls,
; so the game plays with a controller without any setup.

[Mapper]
Type = TotalOverdose

[Properties]
MouseSpeedScalingFactorPercent = 60
ForceFeedbackEffectStrengthPercent = 100

[CustomMapper:TotalOverdose]
StickLeftX  = Split(Keyboard(D), Keyboard(A))
StickLeftY  = Split(Keyboard(S), Keyboard(W))
StickRightX = MouseAxis(X)
StickRightY = MouseAxis(Y)
TriggerRT   = MouseButton(Left)
TriggerLT   = MouseButton(Right)
ButtonA     = Compound(Keyboard(LShift), Keyboard(Enter))
ButtonB     = Keyboard(Space)
ButtonX     = Keyboard(R)
ButtonY     = Keyboard(F)
ButtonLB    = MouseAxis(WheelVertical, -)
ButtonRB    = MouseAxis(WheelVertical, +)
ButtonLS    = Keyboard(LControl)
ButtonRS    = Keyboard(H)
ButtonBack  = Keyboard(Tab)
ButtonStart = Keyboard(Esc)
DpadUp      = Compound(Keyboard(Up), Keyboard(Prior))
DpadDown    = Compound(Keyboard(Down), Keyboard(Next))
DpadLeft    = Compound(Keyboard(Left), Keyboard(Q))
DpadRight   = Compound(Keyboard(Right), Keyboard(E))

