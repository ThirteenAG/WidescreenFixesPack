; Gamepad support for Need for Speed: ProStreet, through Xidi (https://github.com/samuelgr/Xidi)
; with the SDL3 plugin (https://github.com/RibShark/Xidi-SDL3-Plugin) for PlayStation, Switch and other controllers.
;
; The fix expects the layout below, the XInputNative layout with each trigger on its own half axis so
; that both can be pressed at once: it sets up the default controls, the button names in the controls
; menu and the front end buttons for it.
;
; Default controls (the Xbox 360 version's):
;   Left stick      Steer               RT              Accelerate
;   LT              Brake / Reverse     A               E-brake
;   B               Nitrous             LB              Clutch
;   Right stick     Shift up / down     X               Change camera
;   Y               Look back           Back            Reset car
;   Start           Pause               RS              Next song
;   D-pad           Arrows, leaderboard, best line, minimap
;   Right stick left / right    Free look
;
; Front end: A select, B back, X / Y / LB / RB / LT / RT / RS for the on-screen buttons, right stick
; rotates the car.
;
; Stick dead zones are set in the game's options (Interface), 10% by default. A dead zone added to
; [Properties] here would come on top of it.

Plugin = SDL
ControllerBackend = SDL3

[CustomMapper:NFSProStreet]
Template = XInputNative
TriggerLT = Axis(Z, +)
TriggerRT = Axis(RotZ, +)

[Mapper]
Type = NFSProStreet

[Properties]
ForceFeedbackEffectStrengthPercent = 100

