;The Suffering on PC reads only the keyboard and mouse. Xidi turns an XInput controller into the game's default keys
;and mouse: Main in play, Menu in the menus (the left stick moves the menu cursor, A clicks).
;Main: left stick move, right stick look, RT fire, LT throw, A jump, B use, X reload, Y insanity,
;LB/RB previous/next weapon, D-pad up flashlight, down health, left/right previous/next thrown weapon,
;left stick click run/walk, right stick click first person, Back map, Start pause.
;Keep the game's default keyboard settings (Options > Keyboard > Default) for this layout.

[Mapper]
Type = Main

[Properties]
MouseSpeedScalingFactorPercent = 60

[CustomMapper:Main]
ButtonA     = Keyboard(SPACE)
ButtonB     = Keyboard(RETURN)
ButtonX     = Keyboard(R)
ButtonY     = Keyboard(C)
ButtonLB    = Keyboard(LBRACKET)
ButtonRB    = Keyboard(RBRACKET)
TriggerLT   = MouseButton(Right)
TriggerRT   = MouseButton(Left)
ButtonBack  = Keyboard(G)
ButtonStart = Keyboard(ESC)
ButtonLS    = Keyboard(LSHIFT)
ButtonRS    = Keyboard(LCONTROL)
DpadUp      = Keyboard(F)
DpadDown    = Keyboard(TAB)
DpadLeft    = Keyboard(PERIOD)
DpadRight   = Keyboard(COMMA)
StickLeftX  = Split(Keyboard(D), Keyboard(A))
StickLeftY  = Split(Keyboard(S), Keyboard(W))
StickRightX = MouseAxis(X)
StickRightY = MouseAxis(Y)

[CustomMapper:Menu]
ButtonA     = MouseButton(Left)
ButtonB     = Keyboard(ESC)
ButtonX     = Null
ButtonY     = Null
ButtonLB    = Null
ButtonRB    = Null
TriggerLT   = Null
TriggerRT   = Null
ButtonBack  = Null
ButtonStart = Keyboard(ESC)
ButtonLS    = Null
ButtonRS    = Null
DpadUp      = Keyboard(UP)
DpadDown    = Keyboard(DOWN)
DpadLeft    = Keyboard(LEFT)
DpadRight   = Keyboard(RIGHT)
StickLeftX  = MouseAxis(X)
StickLeftY  = MouseAxis(Y)
StickRightX = MouseAxis(X)
StickRightY = MouseAxis(Y)

