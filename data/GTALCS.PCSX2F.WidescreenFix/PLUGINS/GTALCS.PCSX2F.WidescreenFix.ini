[MAIN]
; Skips intro
SkipIntro = 1
; Any aspect ratio support, fixes for 16:9 mode
ImprovedWidescreenSupport = 1
; 0 = 30 FPS, 1 = 60 FPS. Also adjustable in the native Display menu.
Enable60FPS = 0
; Speeds up loading
UnthrottleEmuDuringLoading = 1
; Disables the in-game blur. Also "Blur effect" in More display options.
DisableBlur = 1

[CONTROLS]
; Keyboard and mouse controls (WASD, mouse look/aim/fire, F to enter vehicles).
PCControlScheme = 0
; Mouse angle in radians per pixel at the default camera zoom.
MouseSensitivity = 0.002
InvertMouseY = 0

[HUD]
; Scales the HUD around its screen anchors; 1 preserves the original size (0.5 to 1.5).
HudScale = 1.0
; Native Display menu: Frame rate replaces Widescreen; More display options opens HUD size, Cutscene borders, Blur effect and Fast loading.
; Native Controls menu: PC controls switches keyboard and mouse on or off and opens mouse settings and key bindings.
; Updated fork/injector builds save these settings to this INI when the menu closes.

[DISPLAY]
; Animated borders preserve the original cutscene composition. Disable to see more scenery, without changing zoom.
CutsceneBorders = 1

[BINDINGS]
; Keyboard/mouse keys of the PC control scheme, two per action ("W, UP"). Rebind them in the
; pause menu: Controls > PC controls > Key bindings (Enter: press a key, Esc: cancel, Del: clear,
; Left/Right: first or second key). Names: A-Z, 0-9, F1-F24, SPACE, ENTER, TAB, SHIFT, CTRL, ALT, ESC,
; BACKSPACE, UP/DOWN/LEFT/RIGHT, NUM0-NUM9, NUMPLUS, LMB, RMB, MMB, MOUSE4, MOUSE5, WHEELUP, WHEELDOWN, 0x?? (virtual key).
Forward = W
Backward = S
Left = A
Right = D
Sprint = SHIFT
Walk = ALT
Jump = SPACE
Attack = LMB, NUM0
Aim = RMB
NextTarget = E
PrevTarget = Q
EnterVehicle = F
NextWeapon = WHEELDOWN
PrevWeapon = WHEELUP
LookBehind = C, MMB
Camera = V
ZoomIn = WHEELUP, PAGEUP
ZoomOut = WHEELDOWN, PAGEDOWN
Phone = TAB
Mission = 2, NUMPLUS
Accelerate = W
Brake = S
SteerLeft = A
SteerRight = D
Handbrake = SPACE
Horn = H
VehicleFire = LMB, NUM0
NextRadio = WHEELUP
PrevRadio = WHEELDOWN
LookLeft = Q
LookRight = E
LeanForward = SHIFT, NUM8
LeanBack = CTRL, NUM5
TurretLeft = NUM4
TurretRight = NUM6
TurretUp = NUM8
TurretDown = NUM5
Pause = ESC, BACKTICK
