[MAIN]
HudAspectRatioConstraint = Auto         // Constrains the HUD to an aspect ratio. Use Auto, 16:9, 21:9, or a custom ratio.
FOVFactor = 1.0                         // Makes FOV higher or lower. 1.0 by default.
GraphicNovelMode = 0                    // Set to 0 to make graphic novel pages fill the screen width (their top and bottom get cropped), 1 to show whole pages as in the original game.
GraphicNovelModeKey = 0x71              // Key to switch between fullscreen and original graphic novels display. By default VK_F2. Use keyboard to navigate through pages.
CutsceneBorders = 3                     // Borders around in-engine cutscenes, which always keep the original framing: 0 = no borders, 1 = letterbox, 2 = pillarbox, 3 = both.
NoCutsceneBorderAnimation = 0           // Set to 1 to make cutscene borders appear and disappear instantly instead of sliding in and out.
BorderlessWindowedMode = 1              // Enables borderless windowed mode when the game is launched with -window commandline argument.

[MISC]						            
LoadSaveSlot = -1                       // Skips menu and loads selected save game (0-12, -3 to load most recent, -2 to load last used, -1 to disable).
UseGameFolderForSavegames = 0           // Makes the game store saves inside 'savegames' directory in root folder.
AllowAltTabbingWithoutPausing = 1
MouseSmoothing = 1                      // Set to 0 to turn off the game's mouse smoothing, which carries half of each frame's mouse movement over to the next frame.

