Plugin = SDL
ControllerBackend = SDL3

[Mapper]
Type = Main


[Properties]
MouseSpeedScalingFactorPercent = 50
ForceFeedbackEffectStrengthPercent = 100

[CustomMapper:Main]
ButtonA     = Button(1)
ButtonB     = Button(2)
ButtonX     = Button(3)
ButtonY     = Button(4)
ButtonLB    = Button(5)
ButtonRB    = Keyboard(F5)
TriggerLT   = Button(7)
TriggerRT   = Button(8)
ButtonBack  = Button(9)
ButtonStart = Keyboard(Esc)
ButtonLS    = Button(11)
ButtonRS    = Button(12)
DpadUp      = Keyboard(F2)
DpadDown    = Keyboard(F1)
DpadLeft    = Button(15)
DpadRight   = Button(16)
StickLeftX  = Axis(X)
StickLeftY  = Axis(Y)
StickRightX = Axis(RotX)
StickRightY = Axis(RotY)

[CustomMapper:Menu]
ButtonA     = Keyboard(Enter)
ButtonB     = Keyboard(Esc)
ButtonX     = MouseButton(Left)
ButtonY     = Button(4)
ButtonLB    = Button(5)
ButtonRB    = Button(6)
TriggerLT   = Button(7)
TriggerRT   = Button(8)
ButtonBack  = Button(9)
ButtonStart = Keyboard(Esc)
ButtonLS    = Button(11)
ButtonRS    = Button(12)
DpadUp      = Keyboard(Up)
DpadDown    = Keyboard(Down)
DpadLeft    = Keyboard(Left)
DpadRight   = Keyboard(Right)
StickLeftX  = Split(Keyboard(Right), Keyboard(Left))
StickLeftY  = Split(Keyboard(Down), Keyboard(Up))
StickRightX = MouseAxis(X)
StickRightY = MouseAxis(Y)

[CustomMapper:Pause]
ButtonA     = Button(1)
ButtonB     = Keyboard(Esc)
ButtonX     = Button(3)
ButtonY     = Button(4)
ButtonLB    = Button(5)
ButtonRB    = Keyboard(F9)
TriggerLT   = Button(7)
TriggerRT   = Button(8)
ButtonBack  = Button(9)
ButtonStart = Keyboard(Esc)
ButtonLS    = Button(11)
ButtonRS    = Button(12)
DpadUp      = Button(13)
DpadDown    = Button(14)
DpadLeft    = Button(15)
DpadRight   = Button(16)
StickLeftX  = Axis(X)
StickLeftY  = Axis(Y)
StickRightX = Axis(RotX)
StickRightY = Axis(RotY)

