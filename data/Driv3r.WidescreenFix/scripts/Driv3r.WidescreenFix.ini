[MAIN]
; Resolution list can only display 100 resolutions. The highest resolutions are always kept, the lowest ones are cut off when the list is full.
; Use MinResX, MinResY, MaxResX and MaxResY to limit the resolutions in the list (0 = no limit, the minimum is 640x480 by default).
; ForceMaxRefreshRate=1 will display each resolution only with its maximum refresh rate, 0 will display all refresh rates.
MinResX = 0
MinResY = 0
MaxResX = 0
MaxResY = 0
ForceMaxRefreshRate = 1
SkipIntro = 1
ModernControls = 1                            ; Modern default keyboard, mouse and Xbox controller bindings, used by new profiles and by Reset in the controls menu (0|1).
HudAspectRatioConstraint = Auto               ; Constrains the HUD to an aspect ratio. Use Auto, 16:9, 21:9, or a custom ratio.
FOVFactor = 1.0
DrawDistanceFactor = 4.0
ClipCursor = 1                                ; Locks the mouse cursor to the game window (0|1).
CursorSensitivity = 1.0                       ; Multiplier for the menu mouse cursor speed.

[CAMERA]
Enable = 1                                    ; Orbit the camera around the vehicle with the mouse and the right stick (the one bound to on foot Look). Look back still works. Disabling this will also disable the other options in this section, except mouse look sensitivity on foot.
CameraReturnTimeout = 3.0                     ; Time in seconds before the camera starts returning to the original position.
CameraReturnSpeed = 2.0                       ; Speed at which the camera returns to the original position.
MouseLookSensitivity = 1.0                    ; Multiplier for the mouse look sensitivity, the same in the car and on foot.
StickLookSensitivity = 1.0                    ; Multiplier for the camera look sensitivity with right stick.
InvertLook = 0                                ; Inverts the camera vertical direction.

[GRAPHICS]
SMAA = 0                                      ; Enables SMAA post-processing antialiasing (0|1). Does not work with MSAA.
ConsoleGamma = 0                              ; A custom gamma curve that creates a more contrasted image with deeper colors, similar to how GTA IV looked on the Xbox 360 (0|1).

[TURNINDICATORS]
TurnIndicators = 1							  ; Enable turn indicators, they will automatically activate when turning.
ManualTurnIndicators = 0                      ; Enable manual turn indicators, tap LB or RB on gamepad to activate.
LeftIndicatorKey = 0xDB                       ; VK_OEM_4, the Left Brace key.
RightIndicatorKey = 0xDD                      ; VK_OEM_6, the Right Brace key.
LeftIndicatorButton = 5                       ; Gamepad button, as numbered in the controls menu (Joy But 5 is LB on Xbox controllers). 0 disables it.
RightIndicatorButton = 6                      ; Gamepad button, as numbered in the controls menu (Joy But 6 is RB on Xbox controllers). 0 disables it.
