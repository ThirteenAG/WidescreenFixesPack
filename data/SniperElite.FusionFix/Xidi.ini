;Default controls for an Xbox-compatible pad when the game uses its stock keyboard and mouse bindings.
;The game's DirectInput rebind page stores one binding per action. This layout keeps those bindings available.
;Choose StandardGamepad instead to bind the controller directly in the game's Redefine Controls menu.

[Mapper]
Type = SniperElite

[Properties]
MouseSpeedScalingFactorPercent = 60

[CustomMapper:SniperElite]
ButtonA     = Compound(Keyboard(Enter), Keyboard(E))
ButtonB     = Keyboard(Escape)
ButtonX     = Keyboard(R)
ButtonY     = Keyboard(Period)
ButtonLB    = Keyboard(Comma)
ButtonRB    = Keyboard(F)
TriggerLT   = MouseButton(Right)
TriggerRT   = MouseButton(Left)
ButtonBack  = Keyboard(Tab)
ButtonStart = Keyboard(Escape)
ButtonLS    = Keyboard(Z)
ButtonRS    = Keyboard(B)
DpadUp      = Keyboard(Up)
DpadDown    = Keyboard(Down)
DpadLeft    = Keyboard(Left)
DpadRight   = Keyboard(Right)
StickLeftX  = Split(Keyboard(D), Keyboard(A))
StickLeftY  = Split(Keyboard(S), Keyboard(W))
StickRightX = MouseAxis(X)
StickRightY = MouseAxis(Y)

