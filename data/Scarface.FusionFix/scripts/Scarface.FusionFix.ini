[MAIN]
SkipIntro = 1                                 ; Skips legal screen, intro movies and press-to-start.
ModernControlScheme = 1
ControllerPrompts = 1                         ; Switches keyboard/gamepad icons with last input. Requires the bundled Xidi for active profile mappings.
ScrollWeaponsWithMouseWheel = 1
VehicleCameraRecenterDelay = 3.0              ; Seconds after stick/mouse look before automatic vehicle camera recentering; 0 = no delay. Does not change right-mouse-button aim hold.
WindowedMode = 0                              ; 0 = fullscreen, 1 = borderless windowed (selected resolution), 2 = borderless desktop.
HudAspectRatioConstraint = 4:3                ; Auto = screen aspect; 4:3 = original HUD placement; also accepts 16:9, etc.

[GRAPHICS]
RestoreCharacterBlood = 0                     ; Restores the PS2 character blood texture pass using the game's joint damage and blood_spat texture (0|1).
SMAA = 0                                      ; Enables SMAA post-processing antialiasing (0|1). Does not work with MSAA.
ConsoleGamma = 0                              ; A custom gamma curve that creates a more contrasted image with deeper colors, similar to how GTA IV looked on the Xbox 360 (0|1).
