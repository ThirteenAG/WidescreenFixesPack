; Uses Xidi's built-in XInput backend.

[Mapper]
Type = Main

[CustomMapper:Main]
StickLeftX = Axis(X)
StickLeftY = Axis(Y)
StickRightX = Axis(Z)
StickRightY = Axis(RotZ)
ButtonA = Button(1)
ButtonB = Compound(Button(2), Button(4))
ButtonX = Button(12)
ButtonY = Button(5)
ButtonLB = Button(13)
ButtonRB = Button(14)
TriggerLT = Button(7)
TriggerRT = Button(1)
ButtonBack = Button(9)
ButtonStart = Button(10)
ButtonLS = Button(3)
ButtonRS = Button(8)
DpadUp = Button(11)
DpadDown = Button(3)
DpadLeft = Button(6)
DpadRight = Button(6)

[CustomMapper:Menu]
StickLeftX = Axis(X)
StickLeftY = Axis(Y)
StickRightX = Axis(Z)
StickRightY = Axis(RotZ)
ButtonA = Button(1)
ButtonB = Compound(Button(2), Button(4))
ButtonX = Button(12)
ButtonY = Button(5)
ButtonLB = Button(13)
ButtonRB = Button(14)
TriggerLT = Button(7)
TriggerRT = Button(1)
ButtonBack = Button(9)
ButtonStart = Button(10)
ButtonLS = Button(3)
ButtonRS = Button(8)
DpadUp = Pov(Up)
DpadDown = Pov(Down)
DpadLeft = Pov(Left)
DpadRight = Pov(Right)

[Properties]
ForceFeedbackEffectStrengthPercent = 100

