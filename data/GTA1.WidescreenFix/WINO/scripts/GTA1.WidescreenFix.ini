[MAIN]
; 0 selects the desktop size independently for each axis.
ResX = 0
ResY = 0
; Borderless window centred on the monitor, without changing the display mode (0 = the game's exclusive fullscreen).
WindowedMode = 1
; The window covers the monitor and the picture is scaled to fit (Alt+Enter switches while playing).
FullscreenWindow = 0
; HUD inset in logical pixels (0-32).
HudSafeArea = 8
; Stable software framebuffer for modern DirectDraw wrappers.
SoftwareBuffer = 1
; Preserve original simulation speed with a precise timer instead of Miles' busy wait.
FixFramePacing = 1

[CAMERA]
; GTA3-style overhead camera: stays on the player and smooths the game's look-ahead and height.
SmoothFollow = 1
; Seconds for look-ahead and height changes to settle (0 = immediate).
FollowTime = 0.25
HeightTime = 0.35
; Size of the visible area (1 = original, 1.5 = wider GTA3-like view; 0.5-3).
Zoom = 1.5
; Chinatown Wars style camera: the view turns so the player's vehicle faces the top of the screen.
RotateWithPlayer = 1
RotateInVehicles = 1
; Also turn the view with the player on foot (Chinatown Wars keeps the last vehicle orientation).
RotateOnFoot = 0
; Seconds the view takes to catch up with a heading change (0 = instant).
RotationSmoothing = 0.35
; Key that toggles camera rotation while playing (C; F6 is the game's pause key).
ToggleRotationKey = 0x43

[INPUT]
; WASD moves in screen directions on foot and steers/accelerates in vehicles.
ModernControls = 1
; Aim while stationary with the right stick or a held mouse button.
MouseAim = 1
; Modern gameplay input is limited to single-player outside native recording/replay.
; XInput controllers: left stick/D-pad movement, A jump/brake, Y enter/exit,
; X fire, B special action, LB/RB weapons, triggers accelerate/reverse in vehicles.
Gamepad = 1
StickDeadzone = 0.20
; Modern gameplay bindings use Windows virtual-key codes; 0 disables a binding.
MoveUpKey = 0x57
MoveDownKey = 0x53
MoveLeftKey = 0x41
MoveRightKey = 0x44
FireKey = 0x01
EnterVehicleKey = 0x46
JumpKey = 0x20
SpecialKey = 0x10
PreviousWeaponKey = 0x51
NextWeaponKey = 0x45
PauseKey = 0x50

[SETUP]
; Settings of the original setup program, written by the in-game options (Options > More Options).
; They take the place of the registry values, which installers often leave read-only.
; Language: 0 English, 1 French, 2 German, 3 Italian. Control0-Control9: DirectInput scan codes for
; left, right, up, down, fire, jump, enter vehicle, previous weapon, next weapon and special.
;Language = 0
;Control0 = 203
