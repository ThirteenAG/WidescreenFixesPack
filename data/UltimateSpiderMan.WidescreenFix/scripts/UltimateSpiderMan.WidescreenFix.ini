[MAIN]
SkipIntro = 1                                 ; Skip startup logos and the copyright screen.
HudAspectRatioConstraint = Auto               ; Constrains the HUD to an aspect ratio. Use Auto, 16:9, 21:9, or a custom ratio.
FPSLimit = 60
ClipCursor = 1                                ; Locks the mouse cursor to the active game window (0|1).
WindowedMode = 0                              ; 0 = fullscreen, 1 = borderless windowed (selected resolution), 2 = borderless desktop.
FOVFactor = 1.0
DrawDistanceScale = 1.0                       ; 1.0 = original; up to 2.0 = normal; above 2.0 to 10.0 = expanded streaming and draw distance (experimental, may crash).

[GRAPHICS]
SMAA = 0                                      ; Enables SMAA post-processing antialiasing (0|1). Does not work with MSAA.
ConsoleGamma = 0                              ; A custom gamma curve that creates a more contrasted image with deeper colors, similar to how GTA IV looked on the Xbox 360 (0|1).
