[MAIN]
SkipIntro = 1
SkipMenu = 1
HudScale = 0.8       //  Original value is 1.0.
RadarScale = 0.75    //  Original value is 1.0.
SaveSlot = 5         //  Available slots: 1 through 8
ImproveCameraPC = 1  // SA-style free orbit input.
CenteringDelay = 5.0 // Seconds before vehicle camera centering.
RawMouseInput = 1  // Relative mouse counts; uses the in-game mouse sensitivity and inversion.
RestoreOriginalCamera = 1 // Restores original SA vehicle distance and pitch profiles.

[GRAPHICS]
VisualStyle = 1 // 0 = DE, 1 = PS2 colour style, 2 = PC colour style. Restart to change.
RestoreWeatherColours = 1 // Use original timecycle hues for sky, lighting, clouds and fog.
ColourFilterStrength = 1.0 // Colour-only UE adaptation, 0.0 through 1.0; no temporal trails.
ClassicLODsOnly = 0 // Use original map/object LODs by extending native streaming; increases memory use. Restart to change.
