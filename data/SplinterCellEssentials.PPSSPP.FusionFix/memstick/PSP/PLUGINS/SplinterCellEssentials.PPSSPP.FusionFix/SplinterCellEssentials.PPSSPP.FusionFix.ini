[MAIN]
; Skip the loader's first intro movie (the second is required by the loader)
SkipIntro = 1
; Sets deadzone for both sticks (0.0 - 1.0)
StickDeadzone = 0.1
; Makes movement like in all other games, left stick controls player's speed
SpeedStickControl = 1
; Main-loop frame limiter: native elapsed-time simulation at 60 FPS
Enable60FPS = 1
; Speeds up loading
UnthrottleEmuDuringLoading = 1
; Scale gameplay FOV (Hor+ at any aspect); device close-ups (hacking, keypad, lock pick, optic cable) keep the native FOV for their overlays
FOVFactor = 1.0
; Show loading pictures, briefing screens and FMVs (with subtitles) at the native aspect with black side bars
ContainFullscreenImages = 1
; HUD size, centered in an aspect-correct canvas (0.5 - 1.5)
HudScale = 1.0

