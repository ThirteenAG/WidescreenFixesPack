; Call of Cthulhu reads only the keyboard and mouse on PC. Xidi turns the controller into the game's default keys and
; mouse, so the in-game key configuration keeps working and keyboard and mouse stay usable at the same time.
;
; Left stick        Move (W X A D)
; Right stick       Look (mouse)
; RT                Fire (left mouse button)
; LT                Aim (right mouse button)
; A                 Action (S)
; B                 Crouch (C)
; X                 Reload (R)
; Y                 Jump (Space)
; LB / RB           Lean left / right (Q / E)
; Left stick click  Sneak (Shift)
; Right stick click Hide or show weapon (Z)
; D-pad up          Inventory (I)
; D-pad down        Quick heal (H)
; D-pad left        Look strafe (F)
; Back              Skip scene (Backspace)
; Start             Menu (Esc)

[Mapper]
Type = CallOfCthulhu

[CustomMapper:CallOfCthulhu]
StickLeftX  = Split(Keyboard(D), Keyboard(A))
StickLeftY  = Split(Keyboard(X), Keyboard(W))
StickRightX = MouseAxis(X)
StickRightY = MouseAxis(Y)
TriggerRT   = MouseButton(Left)
TriggerLT   = MouseButton(Right)
ButtonA     = Keyboard(S)
ButtonB     = Keyboard(C)
ButtonX     = Keyboard(R)
ButtonY     = Keyboard(Space)
ButtonLB    = Keyboard(Q)
ButtonRB    = Keyboard(E)
ButtonLS    = Keyboard(LShift)
ButtonRS    = Keyboard(Z)
DpadUp      = Keyboard(I)
DpadDown    = Keyboard(H)
DpadLeft    = Keyboard(F)
ButtonBack  = Keyboard(Back)
ButtonStart = Keyboard(Esc)
