; Xidi turns an Xbox-style (XInput) controller into the keys and mouse of The Punisher's default controls,
; laid out like the console version: the fix loads Xidi and switches between the profiles below.

[Mapper]
Type = Main

[Properties]
MouseSpeedScalingFactorPercent = 60

; Gameplay
[CustomMapper:Main]
StickLeftX  = Split(Keyboard(D), Keyboard(A))
StickLeftY  = Split(Keyboard(S), Keyboard(W))
StickRightX = MouseAxis(X)
StickRightY = MouseAxis(Y)
TriggerRT   = MouseButton(Left)
TriggerLT   = MouseButton(Right)
ButtonA     = Compound(Keyboard(E), Keyboard(Enter))
ButtonB     = Keyboard(Q)
ButtonX     = Keyboard(R)
ButtonY     = Keyboard(T)
ButtonLB    = Keyboard(C)
ButtonRB    = Keyboard(Space)
ButtonLS    = Keyboard(N)
ButtonRS    = Keyboard(F)
ButtonBack  = Keyboard(F1)
ButtonStart = Keyboard(Esc)
DpadUp      = Keyboard(G)
DpadDown    = Keyboard(Tab)
DpadLeft    = Keyboard(1)
DpadRight   = Keyboard(2)

; In-engine cutscenes: A shows the next shot, Start skips the cutscene
[CustomMapper:Cutscene]
ButtonA     = Keyboard(Enter)
ButtonStart = Keyboard(Space)

; The apartment, briefings and the pause menu
[CustomMapper:Menu]
StickLeftX  = Split(Keyboard(RightArrow), Keyboard(LeftArrow))
StickLeftY  = Split(Keyboard(DownArrow), Keyboard(UpArrow))
StickRightX = MouseAxis(X)
StickRightY = MouseAxis(Y)
TriggerRT   = MouseButton(Left)
ButtonA     = Keyboard(Enter)
ButtonB     = Keyboard(Esc)
ButtonX     = Keyboard(Back)
ButtonLB    = Keyboard(Prior)
ButtonRB    = Keyboard(Next)
ButtonStart = Keyboard(Esc)
DpadUp      = Keyboard(UpArrow)
DpadDown    = Keyboard(DownArrow)
DpadLeft    = Keyboard(LeftArrow)
DpadRight   = Keyboard(RightArrow)

