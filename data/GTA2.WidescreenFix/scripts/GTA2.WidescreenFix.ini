[MAIN]
; Output resolution; 0 selects the desktop size independently for each axis.
ResX = 0
ResY = 0
; Use the game's own windowed mode instead of the window-mode wrapper (wndmode.ini).
WindowedMode = 1
; Fill the screen with cropped frontend art without changing its proportions.
; Set to 0 to show the complete 4:3 background with side bars.
FillFrontendBackground = 0
; Extends hud elements to the screen corners (Experimental: might not work correctly for some elements). 
ExtendHud = 1

[MISC]
; Skip intro movie.
SkipMovie = 1
; Skip credits on game quit.
SkipCredits = 1
; Remove delay when an audio entity is deleted.
NoSampManDelay = 1
; Use this to set a key for a quick save.
QuicksaveKey = 0x74
; Use this to set a key for camera zoom increase/decrease.
ZoomIncreaseKey = 0xBB
ZoomDecreaseKey = 0xBD
; Recover the player through the native ground-height/teleport path.
RecoverPlayerKey = 0x77

[CAMERA]
; Chinatown Wars style camera: the view turns so the player's vehicle faces the top of the screen.
RotateWithPlayer = 1
RotateInVehicles = 1
; Also turn the view with the player on foot (Chinatown Wars keeps the last vehicle orientation).
RotateOnFoot = 0
; Seconds the view takes to catch up with a heading change (0 = instant).
RotationSmoothing = 0.35
; Key that toggles camera rotation while playing.
ToggleRotationKey = 0x75
; GTA3-style camera: stays on the player and smooths the game's look-ahead and height changes.
SmoothFollow = 1
; Seconds for look-ahead and height changes to settle (0 = the game's original movement).
FollowTime = 0.25
HeightTime = 0.35
; How far ahead of a vehicle the view may look, as a share of the visible half-height (0-1).
MaxLookAhead = 0.5

[INPUT]
; WASD movement on foot; steering/accelerator controls in vehicles.
ModernControls = 1
Gamepad = 1
StickDeadzone = 0.20
; Aim while stationary with the right stick or held mouse button.
MouseAim = 1
; Modern gameplay bindings use Windows virtual-key codes; 0 disables a binding.
MoveUpKey = 0x57
MoveDownKey = 0x53
MoveLeftKey = 0x41
MoveRightKey = 0x44
FireKey = 0x01
EnterVehicleKey = 0x46
JumpKey = 0x20
SpecialKey = 0x10
PreviousWeaponKey = 0x51
NextWeaponKey = 0x45
PauseKey = 0x50
