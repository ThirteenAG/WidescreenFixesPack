[MAIN]
; Right stick turns the chase camera: sideways looks left/right, pulling back looks behind the car.
; The D-pad keeps its original 90-degree looks. Unbound analog actions rest centred.
DualAnalogPatch = 1
; Viewport aspect ratio: auto reads PPSSPP's window (enable "Stretch" in PPSSPP's display layout for widescreen),
; or force e.g. 16:9, 21:9 or 32:9. The 3D view widens (Hor+) instead of stretching.
ForceAspectRatio = auto
; Keep 2D in its original proportions: HUD elements stay at the screen edges, menus and movies are centred (pillarboxed).
FixHUD = 1
; Scale the race HUD around its screen-edge anchors (0.5 to 1.0). Menus keep their size.
HUDScale = 1.0
