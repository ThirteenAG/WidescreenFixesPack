;THPS2 reads gamepads through DirectInput. This mapping follows its native default action bindings.
;A: jump, B: grab, X: flip, Y: grind; LB/RB: spin, LT: nollie, RT: switch.
;Custom game bindings can be changed in Options > Controls.

[Mapper]
Type = THPS2

[CustomMapper:THPS2]
Template = StandardGamepad
ButtonA = Button(2)
ButtonB = Button(3)
ButtonX = Button(1)
ButtonY = Button(5)
ButtonLB = Button(4)
ButtonRB = Button(6)
TriggerLT = Button(7)
TriggerRT = Button(8)
DpadUp = Axis(Y, -)
DpadDown = Axis(Y, +)
DpadLeft = Axis(X, -)
DpadRight = Axis(X, +)

[Properties]
ForceFeedbackEffectStrengthPercent = 100

