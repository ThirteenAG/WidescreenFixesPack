[PROJECT2DFX]
; Set to 1 to enable
RenderLodLights = 1
; Maximum simultaneously visible distant lights (1-2048), independent of the game's corona pool
CoronaLimit = 900
; Makes lod lights bigger or smaller
CoronaRadiusMultiplier = 1.0
; Affects performance, for better results decrease this value
CoronaFarClip = 1000.0

[DISTANTTRAFFIC]
; Render moving 3D cars/boats on the game's road/water paths, beyond native traffic.
; Liberty City's path data has no water paths, so DistantBoats currently has no effect.
DistantCars = 1
DistantBoats = 1
; Maximum simulated vehicles (0-40 cars, 0-8 boats). Rendering is capped per frame.
MaxCars = 40
MaxBoats = 8
; Traffic fades out at this distance, in world units (450-2000).
DrawDistance = 800.0
