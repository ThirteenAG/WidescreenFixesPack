version: '{build}'
skip_tags: true
image: Visual Studio 2026
configuration: Release
environment:
  APPVEYOR_SAVE_CACHE_ON_ERROR: true
skip_commits:
  files:
    - '**/*.md'
    - '**/*.txt'
install:
- cmd: >-
    git submodule update --init --recursive

    premake5 vs2026

    msbuild build/AsiSettingsValidator.vcxproj /p:Configuration=Release /p:Platform=Win32
cache: build
build:
  project: build/Win64.WidescreenFixesPack.slnx
  parallel: true
  verbosity: minimal
before_package:
- cmd: >-
    before_packaging.bat

    cd data

    release.bat -Available
after_build:
- ps: Get-ChildItem .\Archives\*.zip  | % { Push-AppveyorArtifact $_.FullName -FileName $_.Name }
