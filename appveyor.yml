version: '{build}'
skip_tags: true
image: Visual Studio 2026
configuration: Release
environment:
  APPVEYOR_SAVE_CACHE_ON_ERROR: true
skip_commits:
  files:
    - '**/*.md'
    - '**/*.txt'
cache: build
install:
- cmd: >-
    git submodule update --init --recursive

    premake5.bat
before_build:
- cmd: before_build.bat
build_script:
- cmd: >-
    msbuild -m build/Win64.WidescreenFixesPack.slnx /p:Configuration=Release

    msbuild -m build/PCSX2F.WidescreenFixesPack.slnx /p:Configuration=Release

    msbuild -m build/PPSSPP.WidescreenFixesPack.slnx /p:Configuration=Release

    msbuild -m build/Dolphin.WidescreenFixesPack.slnx /p:Configuration=Release

    msbuild -m build/CXBXR.WidescreenFixesPack.slnx /p:Configuration=Release

    msbuild -m build/Win32.WidescreenFixesPack.slnx /t:MaxPayne\MaxPayne_WidescreenFix /p:Configuration=Release

    msbuild -m build/Win32.WidescreenFixesPack.slnx /t:MaxPayne\MaxPayne2_WidescreenFix /p:Configuration=Release

    msbuild -m build/Win32.WidescreenFixesPack.slnx /t:NeedForSpeed\NFSCarbon_WidescreenFix /p:Configuration=Release

    msbuild -m build/Win32.WidescreenFixesPack.slnx /t:NeedForSpeed\NFSMostWanted_WidescreenFix /p:Configuration=Release

    msbuild -m build/Win32.WidescreenFixesPack.slnx /t:NeedForSpeed\NFSProStreet_FusionFix /p:Configuration=Release

    msbuild -m build/Win32.WidescreenFixesPack.slnx /t:NeedForSpeed\NFSUnderground_WidescreenFix /p:Configuration=Release

    msbuild -m build/Win32.WidescreenFixesPack.slnx /t:NeedForSpeed\NFSUnderground2_WidescreenFix /p:Configuration=Release

    msbuild -m build/Win32.WidescreenFixesPack.slnx /t:NeedForSpeed\NFSUndercover_FusionFix /p:Configuration=Release

    msbuild -m build/Win32.WidescreenFixesPack.slnx /t:NeedForSpeed\NFSTheRun_FusionFix /p:Configuration=Release

    msbuild -m build/Win32.WidescreenFixesPack.slnx /t:SplinterCell\SplinterCellConviction_FusionFix /p:Configuration=Release

    msbuild -m build/Win32.WidescreenFixesPack.slnx /t:SplinterCell\SplinterCellBlacklist_FusionFix /p:Configuration=Release

    msbuild -m build/Win32.WidescreenFixesPack.slnx /t:SplinterCell\SplinterCellChaosTheory_WidescreenFix /p:Configuration=Release

    msbuild -m build/Win32.WidescreenFixesPack.slnx /t:SplinterCell\SplinterCellDoubleAgent_WidescreenFix /p:Configuration=Release

    msbuild -m build/Win32.WidescreenFixesPack.slnx /t:SplinterCell\SplinterCellPandoraTomorrow_WidescreenFix /p:Configuration=Release
before_package:
- cmd: >-
    before_packaging.bat

    cd data

    release.bat
after_build:
- ps: Get-ChildItem .\Archives\*.zip  | % { Push-AppveyorArtifact $_.FullName -FileName $_.Name }