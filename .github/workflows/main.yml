name: GitHub Actions Build

on:
  push:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
    branches:
      - '**'
  pull_request:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write      # GitHub Actions OIDC token: publishes the settings descriptions to fusionfix.io

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Build Solution
      uses: ./.github/workflows/build_all
      with:
        packaging_mode: ${{ github.event_name == 'push' && github.ref_name == 'master' && 'as-ready' || 'after-build' }}
        signing_profile: ${{ github.event_name == 'push' && github.ref_name == 'master' && 'required' || 'off' }}
        hub_policy: ${{ github.event_name == 'push' && github.ref_name == 'master' && 'required' || 'optional' }}
      env:
        CODE_SIGNING_PFX: ${{ github.event_name == 'push' && github.ref_name == 'master' && secrets.CODE_SIGNING_PFX || '' }}
        CODE_SIGNING_PASSWORD: ${{ github.event_name == 'push' && github.ref_name == 'master' && secrets.CODE_SIGNING_PASSWORD || '' }}
        HUB_RELEASE_TOKEN: ${{ secrets.HUB_RELEASE_TOKEN }}
    # Nightly builds publish their settings descriptions to fusionfix.io's dev channel; a refused upload only warns
    - name: Publish the settings descriptions to fusionfix.io (dev)
      if: ${{ github.event_name == 'push' && github.ref_name == 'master' && github.repository == 'ThirteenAG/WidescreenFixesPack' }}
      continue-on-error: true
      shell: pwsh
      run: |
        python -m pip install --quiet pefile==2024.8.26
        python tools/releases/publish-settings.py --channel dev
    - name: Update Tags
      continue-on-error: true
      if: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const sha = process.env.GITHUB_SHA
          if (!sha) {
            core.setFailed('Missing GITHUB_SHA')
            return
          }

          const tags = await github.paginate(github.rest.repos.listTags, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          })

          if (!tags.length) {
            core.info('No tags found to update.')
            return
          }

          for (const tag of tags) {
            const tagName = tag.name
            core.info(`Updating ${tagName} -> ${sha}`)
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tagName}`,
              sha,
              force: true
            })
          }
