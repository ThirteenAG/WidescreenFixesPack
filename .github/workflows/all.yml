name: Release By Tags
run-name: ${{ inputs.request_id && format('Release picker {0}', inputs.request_id) || format('Release {0}', inputs.tag_list) }}

on:
  workflow_call:
    inputs:
      tag_list:
        required: true
        type: string
      project:
        required: false
        type: string
      catalog_hash:
        required: false
        type: string
      request_id:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag_list:
        description: 'Release specified tags:'
        required: true
      catalog_hash:
        description: 'Optional catalog hash supplied by the local picker'
        required: false
      request_id:
        description: 'Optional request ID supplied by the local picker'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Prepare selected releases
      id: selection
      shell: powershell
      env:
        WFP_RELEASE_TAGS: ${{ inputs.tag_list }}
        WFP_CATALOG_HASH: ${{ inputs.catalog_hash }}
      run: ./tools/releases/Prepare.ps1 -Tags $env:WFP_RELEASE_TAGS -CatalogHash $env:WFP_CATALOG_HASH

    - name: Build selected releases
      uses: ./.github/workflows/build_all
      with:
        project: ${{ inputs.project }}
        packages: ${{ steps.selection.outputs.packages }}
        signing_profile: required
      env:
        CODE_SIGNING_PFX: ${{ secrets.CODE_SIGNING_PFX }}
        CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}

    - name: GTA SA The Definitive Edition Fusion Fix
      uses: ./.github/workflows/release_tag
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_list: ${{ steps.selection.outputs.tags }}
        tag: gtasade
        artifacts: data/Archives/GTASADE.FusionFix.zip

    - name: GTA III The Definitive Edition Fusion Fix
