name: "Build All"
description: "Build and package plugins from the JSON release manifest"

inputs:
  project:
    description: "MSBuild commands to run (or empty to build everything)"
    required: false
  packaging_mode:
    description: "after-build or as-ready"
    required: false
    default: "after-build"
  signing_profile:
    description: "required, optional, or off"
    required: false
    default: "optional"

runs:
  using: "composite"
  steps:
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Configure build
      shell: cmd
      run: ./premake5.bat

    - name: Before Build
      shell: cmd
      run: ./before_build.bat

    - name: Install packaging dependencies
      shell: cmd
      run: npm ci --prefix tools/packaging --omit=dev

    - name: Build, package, and upload
      uses: actions/github-script@v9
      env:
        GH_TOKEN: ${{ github.token }}
        WFP_PROJECT_COMMANDS: ${{ inputs.project }}
        WFP_PACKAGING_MODE: ${{ inputs.packaging_mode }}
        WFP_SIGNING_PROFILE: ${{ inputs.signing_profile }}
      with:
        script: |
          const coordinator = require('./tools/packaging/upload.cjs')
          await coordinator.github({
            project: process.env.WFP_PROJECT_COMMANDS,
            mode: process.env.WFP_PACKAGING_MODE,
            signing: process.env.WFP_SIGNING_PROFILE
          })
