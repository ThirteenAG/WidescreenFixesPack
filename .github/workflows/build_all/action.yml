name: "Build All"
description: "Build and package plugins from the JSON release manifest"

inputs:
  packages:
    description: "Selected package IDs, or empty to use the build plan"
    required: false
  project:
    description: "MSBuild commands to run (or empty to build everything)"
    required: false
  packaging_mode:
    description: "after-build or as-ready"
    required: false
    default: "after-build"
  signing_profile:
    description: "required, optional, or off"
    required: false
    default: "optional"
  hub_policy:
    description: "FusionFixHub.exe in the PC fixes' zips: required, optional, or off"
    required: false
    default: "optional"

runs:
  using: "composite"
  steps:
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Configure build
      shell: cmd
      run: ./premake5.bat

    # FusionFixHub.exe ships in every PC fix's zip, next to the game's executable: the latest signed release of the
    # private repository ThirteenAG/FusionFixHub-App, read with the read-only secret HUB_RELEASE_TOKEN passed by the
    # calling workflow. Vendor runtimes and DXVK are never packaged: the hub downloads them.
    - name: Download FusionFixHub
      if: ${{ inputs.hub_policy != 'off' }}
      shell: pwsh
      env:
        GH_TOKEN: ${{ env.HUB_RELEASE_TOKEN }}
        HUB_POLICY: ${{ inputs.hub_policy }}
        # SHA-256 of the signing certificate's SubjectPublicKeyInfo (CN=FusionFix): the key the hub pins for its own updates
        HUB_SIGNER_SPKI_SHA256: 08498b939a9d0743268a74bd824d9cdae5d4557137eef693343e452156ecbfc4
      run: |
        if (-not $env:GH_TOKEN) {
          if ($env:HUB_POLICY -eq 'required') { throw "HUB_RELEASE_TOKEN is not set: a release ships FusionFixHub.exe" }
          Write-Output "::warning::HUB_RELEASE_TOKEN is not set: the packages are built without FusionFixHub.exe"
          exit 0
        }
        New-Item -ItemType Directory -Force build/hub | Out-Null
        gh release download --repo ThirteenAG/FusionFixHub-App --pattern FusionFixHub.exe --dir build/hub --clobber
        if ($LASTEXITCODE -ne 0) { throw "gh release download failed (an expired HUB_RELEASE_TOKEN, or no release with FusionFixHub.exe)" }
        # The digest through WinVerifyTrust (the only chain error allowed is the self-signed root), and the pinned signer key
        Add-Type -TypeDefinition @'
        using System; using System.Runtime.InteropServices;
        public static class HubTrust {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
            public struct FileInfo { public uint cbStruct; public string pcwszFilePath; public IntPtr hFile; public IntPtr pgKnownSubject; }
            [StructLayout(LayoutKind.Sequential)]
            public struct Data { public uint cbStruct; public IntPtr pPolicyCallbackData; public IntPtr pSIPClientData; public uint dwUIChoice; public uint fdwRevocationChecks; public uint dwUnionChoice; public IntPtr pFile; public uint dwStateAction; public IntPtr hWVTStateData; public IntPtr pwszURLReference; public uint dwProvFlags; public uint dwUIContext; public IntPtr pSignatureSettings; }
            [DllImport("wintrust.dll")] static extern int WinVerifyTrust(IntPtr hwnd, ref Guid action, ref Data data);
            public static int Verify(string path) {
                var file = new FileInfo { cbStruct = (uint)Marshal.SizeOf(typeof(FileInfo)), pcwszFilePath = path };
                var pFile = Marshal.AllocHGlobal(Marshal.SizeOf(typeof(FileInfo)));
                Marshal.StructureToPtr(file, pFile, false);
                var data = new Data { cbStruct = (uint)Marshal.SizeOf(typeof(Data)), dwUIChoice = 2, fdwRevocationChecks = 0, dwUnionChoice = 1, pFile = pFile, dwProvFlags = 0x40 };
                var action = new Guid("00AAC56B-CD44-11d0-8CC2-00C04FC295EE");
                int result = WinVerifyTrust(IntPtr.Zero, ref action, ref data);
                Marshal.FreeHGlobal(pFile);
                return result;
            }
        }
        '@
        $hub = (Resolve-Path build/hub/FusionFixHub.exe).Path
        $result = [HubTrust]::Verify($hub)
        $untrustedRoot = -2146762487   # CERT_E_UNTRUSTEDROOT 0x800B0109: the certificate is self-signed
        if ($result -ne 0 -and $result -ne $untrustedRoot) { throw ("FusionFixHub.exe's signature doesn't verify: 0x{0:X8}" -f $result) }
        $sig = Get-AuthenticodeSignature $hub
        if (-not $sig.SignerCertificate) { throw "FusionFixHub.exe has no signer certificate" }
        $spki = $sig.SignerCertificate.PublicKey.ExportSubjectPublicKeyInfo()
        $key = ([System.Security.Cryptography.SHA256]::HashData($spki) | ForEach-Object { $_.ToString('x2') }) -join ''
        if ($key -ne $env:HUB_SIGNER_SPKI_SHA256) { throw "FusionFixHub.exe is signed with another key ($key); the pinned key is $env:HUB_SIGNER_SPKI_SHA256" }
        Write-Output ("FusionFixHub.exe: signature verified (0x{0:X8}), signer '{1}', pinned key matches" -f $result, $sig.SignerCertificate.Subject)

    - name: Install packaging dependencies
      shell: cmd
      run: npm ci --prefix tools/packaging --omit=dev

    - name: Build, package, and upload
      uses: actions/github-script@v9
      env:
        GH_TOKEN: ${{ github.token }}
        WFP_PROJECT_COMMANDS: ${{ inputs.project }}
        WFP_PACKAGES: ${{ inputs.packages }}
        WFP_PACKAGING_MODE: ${{ inputs.packaging_mode }}
        WFP_SIGNING_PROFILE: ${{ inputs.signing_profile }}
        WFP_HUB_POLICY: ${{ inputs.hub_policy }}
      with:
        script: |
          const coordinator = require('./tools/packaging/upload.cjs')
          await coordinator.github({
            project: process.env.WFP_PROJECT_COMMANDS,
            packages: process.env.WFP_PACKAGES,
            mode: process.env.WFP_PACKAGING_MODE,
            signing: process.env.WFP_SIGNING_PROFILE
          })
